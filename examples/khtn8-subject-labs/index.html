<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>KHTN 8 Subject Lab</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #060b10;
      color: #f8fbff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 68% 35%, rgba(78, 175, 255, 0.18), transparent 34%),
        radial-gradient(circle at 22% 72%, rgba(57, 217, 138, 0.13), transparent 28%),
        linear-gradient(135deg, #071118 0%, #10171d 48%, #05070a 100%);
    }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; }
    .panel {
      position: fixed;
      left: 22px;
      top: 22px;
      width: min(386px, calc(100vw - 44px));
      padding: 16px;
      border: 1px solid rgba(213, 232, 255, 0.18);
      border-radius: 12px;
      background: rgba(5, 10, 14, 0.78);
      backdrop-filter: blur(18px) saturate(1.08);
      box-shadow: 0 24px 74px rgba(0, 0, 0, 0.36), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .eyebrow {
      margin: 0 0 7px;
      color: #8de0ff;
      font-size: 11px;
      font-weight: 760;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 8px; font-size: 24px; line-height: 1; letter-spacing: 0; }
    p { margin: 0 0 14px; color: #c7d7e6; font-size: 13px; line-height: 1.42; }
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-bottom: 12px;
    }
    a, button {
      border: 1px solid rgba(213, 232, 255, 0.2);
      border-radius: 10px;
      padding: 9px 7px;
      color: #f8fbff;
      background: rgba(255, 255, 255, 0.06);
      font: inherit;
      font-size: 12px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    a.active, button.active { border-color: rgba(141, 224, 255, 0.92); background: rgba(78, 175, 255, 0.17); }
    label { display: grid; gap: 7px; margin-top: 11px; color: #e6f3ff; font-size: 12px; }
    input { width: 100%; accent-color: #61d394; }
    .readout { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
    .metric { min-width: 0; border: 1px solid rgba(213, 232, 255, 0.12); border-radius: 10px; padding: 9px; background: rgba(255, 255, 255, 0.052); }
    .metric span { display: block; color: #99adc0; font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase; }
    .metric strong { display: block; margin-top: 4px; overflow-wrap: anywhere; font-size: 16px; line-height: 1.1; }
    .hint { position: fixed; right: 22px; bottom: 18px; color: rgba(235, 247, 255, 0.74); font-size: 12px; text-shadow: 0 2px 18px rgba(0, 0, 0, 0.72); }
    @media (max-width: 720px) {
      .panel { left: 10px; right: 10px; top: auto; bottom: 10px; width: auto; padding: 13px; }
      h1 { font-size: 20px; }
      p { display: none; }
      .tabs { grid-template-columns: repeat(3, 1fr); }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <section class="panel" aria-label="KHTN 8 lab controls">
    <p class="eyebrow" id="subject">KHTN 8</p>
    <h1 id="title">Subject Lab</h1>
    <p id="summary"></p>
    <div class="tabs" id="tabs"></div>
    <div id="controls"></div>
    <div class="readout" id="readout"></div>
  </section>
  <div class="hint">Drag to orbit. Scroll to zoom.</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { INITIAL_STATES, LAB_META, SOLVERS, clamp } from "./solvers.mjs";

    const allLabIds = Object.keys(LAB_META);
    const queryLab = new URL(location.href).searchParams.get("lab");
    const labId = allLabIds.includes(queryLab) ? queryLab : "chem-reaction-gas";
    const meta = LAB_META[labId];
    const subjectEl = document.querySelector("#subject");
    const titleEl = document.querySelector("#title");
    const summaryEl = document.querySelector("#summary");
    const tabsEl = document.querySelector("#tabs");
    const controlsEl = document.querySelector("#controls");
    const readoutEl = document.querySelector("#readout");
    const canvas = document.querySelector("#scene");
    const initialState = structuredClone(INITIAL_STATES[labId]);
    const solver = SOLVERS[labId];
    const controlEls = new Map();
    let state = structuredClone(initialState);
    let solution = solver(state);
    let raf = 0;
    let lastSeconds = performance.now() / 1000;
    let simSeconds = 0;

    const LABS = {
      "chem-reaction-gas": {
        summary: "KHTN 8 chemistry: visible gas formation, limiting reagent, and reaction-rate cues in a real bench setup.",
        color: 0x5dd6ff,
        controls: [
          ["acidM", "Acid concentration (M)", 0.4, 2.0, 0.1],
          ["metalG", "Metal ribbon mass (g)", 0.12, 0.84, 0.02],
          ["tempC", "Temperature (C)", 18, 54, 1],
        ],
        outputs: [["gasMl", "Gas", " mL"], ["limiting", "Limit", ""], ["rate", "Rate", "x"]],
        build: buildReactionGas,
      },
      "chem-acid-base": {
        summary: "KHTN 8 chemistry: acid/base neutralization, pH scale, indicator color, and endpoint feedback.",
        color: 0xff73b7,
        controls: [
          ["acidMl", "Acid volume (mL)", 0, 50, 1],
          ["baseMl", "Base volume (mL)", 0, 50, 1],
          ["indicator", "Indicator mode", 0, 1, 1],
        ],
        outputs: [["pH", "pH", ""], ["type", "State", ""], ["neutralizedPct", "Neutral", "%"]],
        build: buildAcidBase,
      },
      "chem-catalyst-rate": {
        summary: "KHTN 8 chemistry: reaction speed changes with temperature, catalyst, and surface area.",
        color: 0xffc45d,
        controls: [
          ["tempC", "Temperature (C)", 15, 60, 1],
          ["catalyst", "Catalyst", 0, 1, 1],
          ["surface", "Surface area factor", 0.5, 2.2, 0.1],
        ],
        outputs: [["rate", "Rate", "x"], ["completionSec", "Finish", " s"], ["collisionIndex", "Collisions", ""]],
        build: buildCatalystRate,
      },
      "phys-pressure": {
        summary: "KHTN 8 physics: liquid pressure grows with depth and density, visible through probe and manometer.",
        color: 0x56c8ff,
        controls: [
          ["depthM", "Probe depth (m)", 0.15, 1.4, 0.01],
          ["density", "Liquid density (kg/m3)", 800, 1250, 10],
          ["areaCm2", "Probe area (cm2)", 6, 32, 1],
        ],
        outputs: [["pressureKPa", "Pressure", " kPa"], ["forceN", "Force", " N"], ["manometerCm", "Column", " cm"]],
        build: buildPressure,
      },
      "phys-lever": {
        summary: "KHTN 8 physics: moment of force, balance, and torque direction on a real lever apparatus.",
        color: 0x9ee76c,
        controls: [
          ["loadN", "Load force (N)", 10, 60, 1],
          ["effortN", "Effort force (N)", 8, 50, 1],
          ["effortArmM", "Effort arm (m)", 0.25, 0.9, 0.01],
        ],
        outputs: [["loadMoment", "Load M", " Nm"], ["effortMoment", "Effort M", " Nm"], ["state", "Balance", ""]],
        build: buildLever,
      },
      "phys-circuit": {
        summary: "KHTN 8 physics: simple circuit with source, resistor, switch, current, and bulb brightness.",
        color: 0xffe66d,
        controls: [
          ["voltage", "Voltage (V)", 1.5, 12, 0.5],
          ["resistance", "Resistance (ohm)", 4, 32, 1],
          ["switchOn", "Switch", 0, 1, 1],
        ],
        outputs: [["currentA", "Current", " A"], ["powerW", "Power", " W"], ["brightnessPct", "Bulb", "%"]],
        build: buildCircuit,
      },
      "bio-circulation": {
        summary: "KHTN 8 biology: heart, vessels, pulse timing, cardiac output, and flow resistance.",
        color: 0xff6978,
        controls: [
          ["heartRate", "Heart rate (bpm)", 45, 140, 1],
          ["strokeMl", "Stroke volume (mL)", 40, 110, 1],
          ["vesselTone", "Vessel resistance", 0.65, 1.35, 0.01],
        ],
        outputs: [["cardiacOutputLMin", "Output", " L/min"], ["flowIndex", "Flow", ""], ["pulseMs", "Pulse", " ms"]],
        build: buildCirculation,
      },
      "bio-respiration": {
        summary: "KHTN 8 biology: lung expansion, diaphragm motion, ventilation, and oxygen uptake.",
        color: 0x79d7ff,
        controls: [
          ["breathRate", "Breathing rate (/min)", 8, 32, 1],
          ["tidalMl", "Tidal volume (mL)", 250, 800, 10],
          ["efficiency", "Gas exchange efficiency (%)", 40, 92, 1],
        ],
        outputs: [["minuteVentilationLMin", "Vent.", " L/min"], ["alveolarVentilationLMin", "Alveolar", " L/min"], ["oxygenUptakeLMin", "O2", " L/min"]],
        build: buildRespiration,
      },
      "bio-ecosystem": {
        summary: "KHTN 8 biology: producers, herbivores, predators, pollution, and ecosystem stability.",
        color: 0x72df88,
        controls: [
          ["producers", "Producers", 20, 100, 1],
          ["herbivores", "Herbivores", 5, 80, 1],
          ["predators", "Predators", 0, 40, 1],
          ["pollution", "Pollution (%)", 0, 70, 1],
        ],
        outputs: [["stabilityPct", "Stable", "%"], ["producerScore", "Food", ""], ["risk", "Risk", ""]],
        build: buildEcosystem,
      },
    };
    const TAB_LABELS = {
      "chem-reaction-gas": "Gas",
      "chem-acid-base": "pH",
      "chem-catalyst-rate": "Rate",
      "phys-pressure": "Press",
      "phys-lever": "Lever",
      "phys-circuit": "Circuit",
      "bio-circulation": "Heart",
      "bio-respiration": "Lung",
      "bio-ecosystem": "Eco",
    };

    const activeLab = LABS[labId];
    subjectEl.textContent = `${meta.subject} - ${meta.topic}`;
    titleEl.textContent = meta.title;
    summaryEl.textContent = activeLab.summary;
    document.title = `${meta.title} - KHTN 8`;

    for (const id of allLabIds) {
      const link = document.createElement("a");
      link.href = `${location.pathname}?lab=${id}`;
      link.className = id === labId ? "active" : "";
      link.textContent = TAB_LABELS[id];
      link.title = LAB_META[id].title;
      tabsEl.append(link);
    }

    for (const [key, label, min, max, step] of activeLab.controls) {
      const wrap = document.createElement("label");
      const input = document.createElement("input");
      input.type = max === 1 && min === 0 && step === 1 ? "checkbox" : "range";
      input.min = min;
      input.max = max;
      input.step = step;
      if (input.type === "checkbox") input.checked = Boolean(state[key]);
      else input.value = state[key];
      wrap.textContent = label;
      wrap.append(input);
      controlsEl.append(wrap);
      controlEls.set(key, input);
      input.addEventListener("input", syncFromControls);
    }

    for (const [key, label] of activeLab.outputs) {
      const node = document.createElement("div");
      node.className = "metric";
      node.innerHTML = `<span>${label}</span><strong id="out-${key}"></strong>`;
      readoutEl.append(node);
    }

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x060b10, 0.03);
    const camera = new THREE.PerspectiveCamera(43, innerWidth / innerHeight, 0.1, 120);
    camera.position.set(6.8, 4.6, 10.4);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.minDistance = 5.4;
    controls.maxDistance = 15;
    controls.maxPolarAngle = Math.PI * 0.48;
    frameViewport();

    scene.add(new THREE.HemisphereLight(0xd8f4ff, 0x111820, 1.55));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
    keyLight.position.set(-4, 7, 5);
    scene.add(keyLight);
    const rimLight = new THREE.PointLight(activeLab.color, 8, 22);
    rimLight.position.set(4.8, 3.4, -4.2);
    scene.add(rimLight);
    addBench();

    const view = activeLab.build();
    syncFromControls();
    addEventListener("resize", resize);
    addEventListener("beforeunload", disposeScene);
    frame();

    function readState() {
      const next = {};
      for (const [key, input] of controlEls) next[key] = input.type === "checkbox" ? (input.checked ? 1 : 0) : Number(input.value);
      return next;
    }

    function writeState(next) {
      for (const [key, value] of Object.entries(next)) {
        const input = controlEls.get(key);
        if (!input) continue;
        if (input.type === "checkbox") input.checked = Boolean(value);
        else input.value = value;
      }
      syncFromControls();
    }

    function syncFromControls() {
      state = readState();
      solution = solver(state);
      for (const [key, , unit] of activeLab.outputs) {
        const out = document.querySelector(`#out-${key}`);
        out.textContent = `${solution[key]}${unit}`;
      }
      view.sync?.(state, solution, simSeconds);
    }

    function resize() {
      frameViewport();
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
      renderer.setSize(innerWidth, innerHeight);
    }

    function frameViewport() {
      const mobile = innerWidth <= 720;
      camera.fov = mobile ? 38 : 43;
      controls.target.set(0, mobile ? -0.95 : 0.55, 0);
      camera.updateProjectionMatrix();
    }

    function frame() {
      const now = performance.now() / 1000;
      const dt = Math.min(now - lastSeconds, 0.1);
      lastSeconds = now;
      simSeconds += dt;
      controls.update();
      view.tick?.(state, solution, simSeconds);
      renderer.render(scene, camera);
      raf = requestAnimationFrame(frame);
    }

    function disposeScene() {
      cancelAnimationFrame(raf);
      removeEventListener("resize", resize);
      controls.dispose();
      scene.traverse((object) => {
        object.geometry?.dispose?.();
        const material = object.material;
        const materials = Array.isArray(material) ? material : [material];
        materials.forEach((item) => {
          item?.map?.dispose?.();
          item?.dispose?.();
        });
      });
      renderer.dispose();
    }

    function benchmark() {
      return {
        id: labId,
        subject: meta.subject,
        state: { inputs: readState(), outputs: solver(readState()) },
        renderer: {
          pixelRatio: renderer.getPixelRatio(),
          memory: { ...renderer.info.memory },
          render: { ...renderer.info.render },
        },
        scene: {
          objects: scene.children.length,
          externalAssets: 0,
          detailMarkers: view.detailMarkers || 0,
          solver: "formula/fixed-step visual sync",
        },
        textures: { externalTextures: 0 },
      };
    }

    window.__LAB_BENCHMARK__ = benchmark;
    window.__LAB_BENCH_MUTATE__ = () => {
      const next = structuredClone(initialState);
      for (const [key, input] of controlEls) {
        if (input.type === "checkbox") next[key] = initialState[key] ? 0 : 1;
        else next[key] = Number(input.max) - (Number(input.max) - Number(input.min)) * 0.28;
      }
      writeState(next);
      return benchmark();
    };
    window.__LAB_BENCH_RESET__ = () => {
      simSeconds = 0;
      writeState(initialState);
      return benchmark();
    };

    function mat(color, options = {}) {
      return new THREE.MeshStandardMaterial({ color, roughness: 0.48, metalness: 0.04, ...options });
    }

    function addBench() {
      const table = new THREE.Mesh(new THREE.CylinderGeometry(6.6, 7.2, 0.22, 72), mat(0x1b2933, { metalness: 0.16 }));
      table.name = "lab bench";
      table.position.y = -1.35;
      scene.add(table);
      const grid = new THREE.GridHelper(12, 24, activeLab.color, 0x24313a);
      grid.position.y = -1.22;
      grid.material.transparent = true;
      grid.material.opacity = 0.17;
      scene.add(grid);
    }

    function mesh(geometry, material, name, position = [0, 0, 0]) {
      const object = new THREE.Mesh(geometry, material);
      object.name = name;
      object.position.set(...position);
      scene.add(object);
      return object;
    }

    function box(name, size, position, color, options) {
      return mesh(new THREE.BoxGeometry(...size), mat(color, options), name, position);
    }

    function cyl(name, radius, height, position, color, options, segments = 32) {
      return mesh(new THREE.CylinderGeometry(radius, radius, height, segments), mat(color, options), name, position);
    }

    function cone(name, radius, height, position, color, options, segments = 24) {
      return mesh(new THREE.ConeGeometry(radius, height, segments), mat(color, options), name, position);
    }

    function torus(name, radius, tubeRadius, position, color, options, segments = 36) {
      return mesh(new THREE.TorusGeometry(radius, tubeRadius, segments, segments), mat(color, options), name, position);
    }

    function sphere(name, radius, position, color, options, segments = 32) {
      return mesh(new THREE.SphereGeometry(radius, segments, Math.max(12, segments / 2)), mat(color, options), name, position);
    }

    function tube(name, points, radius, color, options = {}) {
      const curve = new THREE.CatmullRomCurve3(points.map((p) => new THREE.Vector3(...p)));
      return mesh(new THREE.TubeGeometry(curve, 72, radius, 8, false), mat(color, options), name);
    }

    function label(text, position, color = "#eaf7ff") {
      const canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 80;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "rgba(5,10,14,.72)";
      ctx.fillRect(0, 0, 256, 80);
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.strokeRect(2, 2, 252, 76);
      ctx.fillStyle = color;
      ctx.font = "700 24px Inter, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, 128, 42);
      const texture = new THREE.CanvasTexture(canvas);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
      sprite.name = `${text} label`;
      sprite.position.set(...position);
      sprite.scale.set(1.25, 0.4, 1);
      scene.add(sprite);
      return sprite;
    }

    function ticks(name, count, start, step, color = 0xe8f8ff) {
      return Array.from({ length: count }, (_, i) => box(name, [0.04, 0.16, 0.025], [start[0] + step[0] * i, start[1] + step[1] * i, start[2] + step[2] * i], color, { metalness: 0.15 }));
    }

    function flowArrow(name, points, color) {
      const body = tube(`${name} flow`, points, 0.025, color, { emissive: color, emissiveIntensity: 0.45 });
      const tip = cone(`${name} arrow`, 0.11, 0.28, points.at(-1), color, { emissive: color, emissiveIntensity: 0.55 }, 18);
      tip.rotation.z = -Math.PI / 2;
      return { body, tip };
    }

    function leaf(name, position, color = 0x72df88) {
      const item = sphere(name, 0.12, position, color, { emissive: 0x123b18, emissiveIntensity: 0.16 }, 16);
      item.scale.set(0.55, 0.15, 1.0);
      return item;
    }

    function instanced(name, geometry, material, specs, apply) {
      const group = new THREE.InstancedMesh(geometry, material, specs.length);
      group.name = name;
      const dummy = new THREE.Object3D();
      specs.forEach((spec, i) => {
        apply(dummy, spec, i);
        dummy.updateMatrix();
        group.setMatrixAt(i, dummy.matrix);
      });
      group.instanceMatrix.needsUpdate = true;
      scene.add(group);
      return { group, dummy, specs, apply };
    }

    function liquidColor(pH) {
      if (pH < 4) return 0xff546a;
      if (pH < 6.7) return 0xffa95d;
      if (pH < 7.4) return 0x60d394;
      if (pH < 10) return 0x5ba8ff;
      return 0x9d73ff;
    }

    function makeBubbleCloud(count, color) {
      const geometry = new THREE.SphereGeometry(0.045, 12, 8);
      const material = mat(color, { emissive: color, emissiveIntensity: 0.35, transparent: true, opacity: 0.72 });
      return Array.from({ length: count }, (_, i) => {
        const b = new THREE.Mesh(geometry, material);
        b.position.set(Math.sin(i * 1.7) * 0.42, -0.55 + (i % 7) * 0.15, Math.cos(i * 2.2) * 0.28);
        scene.add(b);
        return b;
      });
    }

    function buildReactionGas() {
      const flask = cyl("glass reaction flask", 0.78, 1.5, [-1.45, -0.45, 0], 0x9edcff, { transparent: true, opacity: 0.22, metalness: 0, roughness: 0.05 }, 48);
      const liquid = cyl("acid liquid", 0.7, 0.72, [-1.45, -0.84, 0], 0x72c6ff, { transparent: true, opacity: 0.58, emissive: 0x123344, emissiveIntensity: 0.18 }, 48);
      const meniscus = cyl("acid meniscus", 0.72, 0.018, [-1.45, -0.46, 0], 0xb8f0ff, { transparent: true, opacity: 0.72, emissive: 0x15445a, emissiveIntensity: 0.18 }, 48);
      const base = cyl("flask foot", 0.9, 0.06, [-1.45, -1.25, 0], 0xc7edff, { transparent: true, opacity: 0.28 }, 48);
      const neck = cyl("flask neck", 0.22, 1.0, [-1.45, 0.62, 0], 0x9edcff, { transparent: true, opacity: 0.2 }, 32);
      const rim = torus("flask lip rim", 0.22, 0.014, [-1.45, 1.13, 0], 0xc7edff, { transparent: true, opacity: 0.42 }, 24);
      rim.rotation.x = Math.PI / 2;
      const hose = tube("gas hose", [[-1.25, 1.05, 0], [-0.2, 1.3, 0.15], [0.8, 1.05, 0]], 0.045, 0x2c3f4f, { metalness: 0.05 });
      const syringe = cyl("gas syringe barrel", 0.3, 2.6, [1.85, 0.42, 0], 0xb8e6ff, { transparent: true, opacity: 0.24 }, 32);
      syringe.rotation.z = Math.PI / 2;
      const piston = box("gas syringe piston", [0.16, 0.7, 0.7], [1.1, 0.42, 0], 0xe8f8ff, { metalness: 0.2 });
      const clampRod = cyl("retort stand rod", 0.035, 2.55, [-2.58, -0.08, -0.35], 0x9aa4b1, { metalness: 0.62 }, 16);
      const standBase = box("retort stand base", [0.95, 0.08, 0.62], [-2.58, -1.31, -0.35], 0x59616c, { metalness: 0.42 });
      const clampArm = box("flask clamp", [1.05, 0.05, 0.08], [-2.05, 0.5, -0.35], 0xb9c3cd, { metalness: 0.55 });
      const scaleMarks = ticks("syringe scale tick", 9, [0.95, 0.72, 0.32], [0.23, 0, 0], 0xe8f8ff);
      const gasTrail = flowArrow("hydrogen", [[-0.95, 0.95, 0.02], [-0.35, 1.16, 0.18], [0.42, 1.05, 0.05]], 0xd8f7ff);

      const roots = instanced("root network", new THREE.CylinderGeometry(1, 1, 1, 6), mat(0xc5a572, { roughness: 0.86 }), rootSpecs, (d, p) => {
        d.position.set(p.x + Math.cos(p.a) * p.len * 0.5, -1.02, p.z + Math.sin(p.a) * p.len * 0.5);
        d.rotation.set(Math.PI / 2, 0, p.a);
        d.scale.set(0.012, p.len, 0.012);
      });
      const herbivores = instanced("herbivore insects", new THREE.SphereGeometry(1, 12, 8), mat(0xd7c06a, { roughness: 0.42 }), herbivoreSpecs, (d, p, i) => {
        d.position.set(p.x, -0.6 + Math.sin(i) * 0.03, p.z);
        d.rotation.set(0, p.a, 0);
        d.scale.set(0.13, 0.07, 0.2);
      });
      const predators = instanced("predator markers", new THREE.ConeGeometry(1, 1, 4), mat(0xff6b6b, { roughness: 0.36, emissive: 0x3b0710, emissiveIntensity: 0.12 }), predatorSpecs, (d, p) => {
        d.position.set(p.x, -0.5, p.z);
        d.rotation.set(Math.PI / 2, p.a, Math.PI / 4);
        d.scale.set(0.11, 0.26, 0.11);
      });
      const insectLegs = instanced("herbivore insect legs", new THREE.CylinderGeometry(1, 1, 1, 5), mat(0x5f5434, { roughness: 0.52 }), herbivoreSpecs.flatMap((p) => [-1, 1, -0.5, 0.5].map((side) => ({ ...p, side }))), (d, p, i) => {
        d.position.set(p.x + Math.sign(p.side) * 0.08, -0.65, p.z + (Math.abs(p.side) === 1 ? 0.06 : -0.06));
        d.rotation.set(Math.PI / 2, 0, p.a + p.side * 0.55);
        d.scale.set(0.008, 0.13, 0.008);
      });
      const fungiStems = instanced("decomposer fungi stems", new THREE.CylinderGeometry(1, 1, 1, 8), mat(0xe8dfc8, { roughness: 0.72 }), fungiSpecs, (d, p) => {
        d.position.set(p.x, -0.74 + p.h / 2, p.z);
        d.scale.set(0.025, p.h, 0.025);
      });
      const fungiCaps = instanced("decomposer fungi caps", new THREE.SphereGeometry(1, 12, 8), mat(0xff9a66, { roughness: 0.52, emissive: 0x3a1207, emissiveIntensity: 0.12 }), fungiSpecs, (d, p) => {
        d.position.set(p.x, -0.73 + p.h, p.z);
        d.scale.set(0.1, 0.035, 0.1);
      });
      const pondRocks = instanced("pond stones", new THREE.SphereGeometry(1, 10, 6), mat(0x77705d, { roughness: 0.9 }), rockSpecs, (d, p, i) => {
        d.position.set(p.x, -0.66 + (i % 2) * 0.012, p.z);
        d.scale.set(p.s * 1.25, p.s * 0.52, p.s);
      });
      const pollution = instanced("pollution particle cloud", new THREE.SphereGeometry(1, 10, 6), mat(0xb08a5d, { transparent: true, opacity: 0.72, emissive: 0x3a2507, emissiveIntensity: 0.1 }), pollutionSpecs, (d, p) => {
        d.position.set(p.x, p.y, p.z);
        d.scale.setScalar(p.s);
      });
      const birdBody = sphere("predator bird body", 0.18, [1.62, -0.38, -0.38], 0x6c6258, { roughness: 0.62 }, 16);
      birdBody.scale.set(1.35, 0.72, 0.82);
      const birdWing = sphere("predator bird wing", 0.12, [1.52, -0.36, -0.35], 0x3f3a35, { roughness: 0.66 }, 12);
      birdWing.scale.set(1.35, 0.14, 0.72);
      const birdHead = sphere("predator bird head", 0.09, [1.84, -0.25, -0.35], 0x70675d, { roughness: 0.62 }, 12);
      const birdBeak = cone("predator bird beak", 0.035, 0.12, [1.94, -0.24, -0.35], 0xe4b44a, { roughness: 0.45 }, 10);
      birdBeak.rotation.z = -Math.PI / 2;
      const birdParts = [birdBody, birdWing, birdHead, birdBeak];
      const log = cyl("fallen log", 0.11, 0.9, [-0.6, -0.65, 0.85], 0x7a5131, { roughness: 0.9 }, 12);
      log.rotation.z = Math.PI / 2;
      log.rotation.y = 0.45;
      const logRings = [
        torus("log ring", 0.115, 0.008, [-1.0, -0.65, 1.02], 0xd0a06d, { roughness: 0.8 }, 12),
        torus("log ring", 0.115, 0.008, [-0.2, -0.65, 0.67], 0xd0a06d, { roughness: 0.8 }, 12),
      ];
      logRings.forEach((ring) => ring.rotation.y = Math.PI / 2);
      const energyA = flowArrow("sun to producer", [[-1.82, 0.88, -0.55], [-1.25, 0.45, -0.32], [-0.68, 0.05, -0.14]], 0xffe66d);
      const energyB = flowArrow("producer to herbivore", [[-0.45, -0.28, 0.15], [0.15, -0.16, 0.25], [0.65, -0.32, 0.28]], 0x8df0a5);
      const energyC = flowArrow("herbivore to predator", [[0.68, -0.2, 0.18], [1.18, -0.06, 0.08], [1.54, -0.22, -0.06]], 0xff9aaa);
      label("producers", [-0.88, 0.36, 0.55], "#8df0a5");
      label("food web", [0.78, 0.45, 0.48], "#ffe66d");
      label("soil + roots", [-1.35, -1.18, 2.38], "#d5bb88");
      label("decomposers", [-1.88, -0.18, 0.55], "#ffbd8d");
      label("pollution stress", [1.82, 0.24, 0.6], "#d4b38b");
      const haze = sphere("pollution haze", 1.9, [0, 0.05, 0], 0x8b6f4e, { transparent: true, opacity: 0.08, emissive: 0x3a2507, emissiveIntensity: 0.08 }, 32);
      haze.scale.set(1.4, 0.55, 1.0);
      function refresh(instance, count) {
        instance.group.count = Math.round(clamp(count, 0, instance.specs.length));
        for (let i = 0; i < instance.group.count; i += 1) {
          instance.apply(instance.dummy, instance.specs[i], i);
          instance.dummy.updateMatrix();
          instance.group.setMatrixAt(i, instance.dummy.matrix);
        }
        instance.group.instanceMatrix.needsUpdate = true;
      }
      return {
        sync(s, out) {
          const plantCount = Math.round(s.producers / 100 * plantSpecs.length);
          refresh(plantStems, plantCount);
          refresh(plantLeaves, plantCount * 2);
          refresh(broadLeaves, s.producers / 100 * broadLeafSpecs.length);
          refresh(moss, s.producers / 100 * mossSpecs.length);
          refresh(roots, plantCount * 0.72);
          refresh(herbivores, s.herbivores / 80 * herbivoreSpecs.length);
          refresh(insectLegs, s.herbivores / 80 * insectLegs.specs.length);
          refresh(predators, s.predators / 40 * predatorSpecs.length);
          birdParts.forEach((part) => part.visible = s.predators > 6);
          refresh(fungiStems, clamp((100 - out.stabilityPct) / 100 * fungiSpecs.length + 5, 5, fungiSpecs.length));
          refresh(fungiCaps, fungiStems.group.count);
          refresh(pollution, s.pollution / 70 * pollutionSpecs.length);
          haze.material.opacity = 0.05 + s.pollution / 180;
          terrain.material.color.setHex(out.stabilityPct > 70 ? 0x31513c : out.stabilityPct > 40 ? 0x5a5132 : 0x4c3430);
          humus.material.color.setHex(out.stabilityPct > 70 ? 0x533f2d : 0x57452f);
          energyA.body.material.emissiveIntensity = 0.24 + out.producerScore / 160;
          energyB.body.material.emissiveIntensity = 0.24 + s.herbivores / 120;
          energyC.body.material.emissiveIntensity = 0.24 + s.predators / 70;
        },
        tick(s, out, t) {
          glassWall.rotation.y = Math.sin(t * 0.12) * 0.01;
          topRim.rotation.z = bottomRim.rotation.z = Math.sin(t * 0.12) * 0.01;
          water.rotation.y = t * 0.08;
          haze.rotation.y = t * 0.05;
          pollution.group.rotation.y = t * 0.03;
        },
        detailMarkers: plantSpecs.length + leafSpecs.length + broadLeafSpecs.length + mossSpecs.length + rootSpecs.length + visibleRoots.length + worms.length + tallGrassSpecs.length + flowerSpecs.length + rockSpecs.length + herbivoreSpecs.length + insectLegs.specs.length + predatorSpecs.length + birdParts.length + logRings.length + fungiSpecs.length + pollutionSpecs.length + algae.length + lilyPads.length,
      };
    }
  </script>
