name: Deploy model gallery
on:
  push:
    branches: [main, codex/unified-3d-studio]
    paths:
      - 'gallery/**'
      - 'assets/showcase/lab029s/**'
      - 'scripts/build-gallery.mjs'
      - 'tests/gallery.test.mjs'
      - 'plugins/threejs-lab/skills/threejs-studio/web/motion.js'
      - 'plugins/threejs-lab/skills/threejs-studio/package*.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run setup
      - run: node --test tests/gallery.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/gallery
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
